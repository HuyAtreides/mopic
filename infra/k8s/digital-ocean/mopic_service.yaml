apiVersion: v1
kind: Service
metadata:
  name: mopic-service
  annotations:
    kubernetes.digitalocean.com/load-balancer-id: 'mopic-service-load-balancer'
    service.beta.kubernetes.io/do-loadbalancer-size-unit: '3'
    service.beta.kubernetes.io/do-loadbalancer-disable-lets-encrypt-dns-records: 'false'
spec:
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: qbittorrent
    - port: 8081
      targetPort: 7878
      protocol: TCP
      name: radarr
    - port: 8082
      targetPort: 9696
      protocol: TCP
      name: prowlarr
    - port: 8083
      targetPort: 8096
      protocol: TCP
      name: jellyfin
  type: LoadBalancer
  selector:
    app: mopic
